<title>Trap Dash Gameplay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a device stage. Toolbar picks the device + orientation, the device frame holds the live game; notes underneath. Single dark look. */
:root{--bg:#0F111A;--panel:#1B1E2D;--panel2:#232739;--line:#2F3450;--fg:#EEF0FA;--mute:#9CA3C4;--accent:#FFC53D;--danger:#FF5C7A;--ok:#5EE6B5;
--display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4.5vw,44px);line-height:1.05}h1 span{color:var(--accent)}
.lead{color:var(--mute);max-width:70ch;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-weight:800;font-size:13px;background:var(--panel);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#1B1400;border-color:var(--accent)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--mute)}
.hint kbd{font-family:var(--mono);font-size:11.5px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--fg)}
.stagebox{display:flex;justify-content:center;align-items:center;min-height:300px}
.device{position:relative;background:#06070B;border-radius:34px;padding:12px;box-shadow:0 0 0 2px #2A2E40,0 30px 60px rgba(0,0,0,.55);max-width:100%;transition:width .3s,height .3s}
.device.tablet{border-radius:26px;padding:16px}
.device.full{border-radius:0;padding:0;box-shadow:none}
.screen{position:relative;width:100%;height:100%;border-radius:24px;overflow:hidden;background:#000;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:none}
.device.tablet .screen{border-radius:12px}.device.full .screen{border-radius:0}
.game{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;pointer-events:none}
.hud>*{pointer-events:auto}
.hearts{display:flex;gap:3px;background:rgba(10,12,22,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 9px;backdrop-filter:blur(6px)}
.heart{width:18px;height:16px;display:block}
.pill{font-family:var(--display);font-size:15px;background:rgba(10,12,22,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 12px;white-space:nowrap;backdrop-filter:blur(6px)}
.pill small{font-family:var(--body);font-weight:800;font-size:11px;color:var(--ok);margin-left:6px}
.right{display:flex;gap:6px;align-items:center}
.coins{display:flex;align-items:center;gap:5px;font-family:var(--display);font-size:15px;background:rgba(10,12,22,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 10px 3px 5px;font-variant-numeric:tabular-nums}
.coins i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF3B0,#FFC53D 60%,#C98A0B);box-shadow:0 0 8px rgba(255,200,80,.6)}
.ibtn{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(10,12,22,.55);color:#fff;font-size:15px;font-weight:900;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.prog{position:absolute;left:12px;right:12px;top:52px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;pointer-events:none}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.pad{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:0 16px 14px;position:absolute;left:0;right:0;bottom:0;pointer-events:none}
.pad>div{display:flex;gap:10px;pointer-events:auto}
.cbtn{width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(15,17,26,.38);color:#fff;font-size:24px;font-weight:900;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(4px);touch-action:none;transition:transform .06s,background .06s}
.cbtn.on{transform:scale(.92);background:rgba(255,255,255,.28)}
.cbtn.jump{width:78px;height:78px;font-size:13px;font-family:var(--display);letter-spacing:.04em;background:rgba(255,197,61,.35);border-color:rgba(255,197,61,.8)}
.portrait .hud{padding:8px 8px;gap:4px}.portrait .pill{font-size:13px;padding:3px 9px}.portrait .pill small{display:none}.portrait .coins{font-size:13px}.portrait .ibtn{width:30px;height:30px}.portrait .hearts{padding:4px 7px}.portrait .heart{width:15px;height:14px}.portrait .prog{top:46px}
.portrait .pad{position:relative;flex:0 0 auto;height:34%;min-height:150px;background:linear-gradient(180deg,#171A28,#0D0F18);align-items:center;padding:12px 22px;border-top:1px solid rgba(255,255,255,.08)}
.portrait .cbtn{width:76px;height:76px;background:#232739;border-color:#3A4060}
.portrait .cbtn.jump{width:96px;height:96px;background:linear-gradient(180deg,#FFD46A,#F2A900);color:#1B1400;border-color:#FFE08A;font-size:16px}
.portrait .cbtn.on{background:#3A4060}.portrait .cbtn.jump.on{background:#E09A00}
.sheet{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,7,14,.62);backdrop-filter:blur(3px);padding:14px;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;width:min(330px,100%);display:flex;flex-direction:column;gap:9px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.card h3{font-size:24px}.card p{margin:0;color:var(--mute);font-size:13.5px}
.btn{font:inherit;font-weight:900;font-size:14px;border-radius:12px;padding:11px 12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);cursor:pointer;width:100%}
.btn.gold{background:var(--accent);border-color:var(--accent);color:#1B1400}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06231A}
.btn small{display:block;font-weight:700;font-size:11px;opacity:.75}
.row{display:flex;gap:8px}.row .btn{flex:1}
.tog{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:12px;padding:9px 12px;font-weight:800}
.sw{width:44px;height:26px;border-radius:13px;background:#3A4060;border:0;position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--ok)}.sw[aria-checked="true"]::after{left:21px}
.stars{display:flex;justify-content:center;gap:6px;font-size:30px;color:#3A4060}.stars .on{color:var(--accent);text-shadow:0 0 12px rgba(255,197,61,.6)}
.ad{position:absolute;inset:0;z-index:8;background:linear-gradient(135deg,#2B1E5A,#0E5A6B);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:20px}
.ad .tag{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:6px}
.ad .cnt{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:999px}
.ad h3{font-size:26px}.ad .bar2{width:min(260px,80%);height:5px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}.ad .bar2 i{display:block;height:100%;width:0;background:#5EE6B5}
.ad button{font:inherit;font-weight:900;border:0;border-radius:999px;padding:8px 16px;background:#fff;color:#111;cursor:pointer}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.note h3{font-size:18px;color:var(--accent)}
.note ul{margin:0;padding-left:18px;color:var(--mute);font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.note b{color:var(--fg)}
.toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:rgba(10,12,22,.75);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:5px 14px;font-weight:900;font-size:13px;white-space:nowrap;pointer-events:none;transition:opacity .25s}
.heroes{display:flex;flex-direction:column;gap:10px}.heroes h2{font-size:24px}
.hgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.hgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.hcard .ht{display:none}}
.hcard{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:0 0 10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left}
.hcard canvas{width:100%;aspect-ratio:16/10;display:block}
.hcard .hn{font-family:var(--display);font-size:20px;padding:0 12px}
.hcard .ht{font-size:12.5px;color:var(--mute);padding:0 12px}
.hcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,197,61,.18)}
@media (prefers-reduced-motion:reduce){.device{transition:none}}
</style>
